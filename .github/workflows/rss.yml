name: Update RSS

on:
  schedule:
    - cron: "*/10 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: t66y-rss-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate RSS
        run: python rss.py

      - name: Commit RSS data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data feed.xml

          git diff --cached --quiet || git commit -m "Update RSS feeds"

          git pull --rebase
          git push
